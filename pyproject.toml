[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone_music"
version = "0.2.3"
description = "Album discs, custom jukeboxes and synchronized music for Bedrock 26.65 / Endstone 0.11.16"
requires-python = ">=3.11"
authors = [{name = "Antigravity", email = "antigravity@example.com"}]
dependencies = [
    "endstone>=0.11.16,<0.12",
]

[project.entry-points."endstone"]
music = "endstone_music:EndstoneMusicPlugin"

[tool.endstone]
name = "music"
version = "0.2.3"
main = "endstone_music:EndstoneMusicPlugin"
description = "Custom music, album discs and positional jukeboxes"
requires-python = ">=3.11"
authors = ["Antigravity"]

[tool.endstone.commands]
cmusic = { description = "Manage discs, jukeboxes and global playlists", usages = ["/cmusic", "/cmusic <reload|generate|migrate|status|stop|next|playlists|recover>", "/cmusic <play|give|bind> <id: str>", "/cmusic give <id: str> <player: str>", "/cmusic playlist <create|delete> <id: str>", "/cmusic playlist add <id: str> <sound: str> [seconds: float]", "/cmusic playlist remove <id: str> <track: int>", "/cmusic playlist move <id: str> <from: int> <to: int>", "/cmusic playlist loop <id: str> <on|off>"], permissions = ["endstone_music.command.cmusic"] }

[tool.endstone.permissions]
"endstone_music.command.cmusic" = { description = "Allow using cmusic command", default = "op" }

